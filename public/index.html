<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МАФИЯ · глаз бога</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#b7bdae;         /* фон-подложка */
    --paper:#f2efe6;        /* панели-бумага */
    --paper-2:#e9e5d8;      /* панель темнее */
    --ink:#2c2c28;          /* тёмная рамка/текст */
    --ink-soft:#5a5a52;
    --line:#2c2c28;
    /* фракции */
    --mafia-bg:#f6d9d8; --mafia-br:#d98f8c; --mafia-tx:#b5352c;
    --think-bg:#d9e6f1; --think-br:#a7c3dc; --think-tx:#2a6aa0;
    --whisp-bg:#ece1f0; --whisp-br:#c3a9d0; --whisp-tx:#7a4a95;
    --dead-bg:#f4e7a6; --dead-br:#d4bd4c; --dead-tx:#7a5c12;
    --act-bg:#e6e2d6; --act-br:#bdb8a6; --act-tx:#6a4a2a;
    --narr:#71818f;
    --good:#2f8f4e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--sage);
    font-family:ui-monospace,"DejaVu Sans Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
    color:var(--ink);
    display:flex;justify-content:center;
    padding:14px;
    -webkit-font-smoothing:none;
  }
  .machine{
    width:100%;max-width:680px;display:flex;flex-direction:column;gap:6px;
    height:calc(100vh - 20px);
  }
  .pixel{font-family:"Pixelify Sans",ui-monospace,monospace;}

  /* панель-каркас с «толстой» пиксельной рамкой */
  .panel{
    background:var(--paper);
    border:3px solid var(--line);
    box-shadow:inset 0 0 0 2px var(--paper), 4px 4px 0 rgba(44,44,40,.18);
  }

  /* ── верхняя панель ─────────────────────────── */
  .topbar{display:flex;align-items:stretch;gap:8px;padding:6px}
  .title{
    display:flex;align-items:center;padding:6px 14px;
    background:var(--paper-2);border:2px solid var(--line);
    font-size:26px;font-weight:700;letter-spacing:1px;
  }
  .chip{
    display:flex;align-items:center;gap:7px;padding:6px 12px;
    background:var(--paper-2);border:2px solid var(--line);
    font-size:14px;font-weight:600;white-space:nowrap;
  }
  .chip.day{color:#a6791f}
  .chip.mode{margin-left:auto;color:#3d3d3d}
  .chip .eye{font-size:15px}
  /* ── Глаз бога: выключатель секретов ─────────── */
  .chip.mode{cursor:pointer;user-select:none;opacity:.55;transition:opacity .15s}
  .chip.mode.on{opacity:1;color:#b5352c}
  .chip.mode.on .eye{filter:drop-shadow(0 0 2px #b5352c88)}
  body.blind .plaque.secret,
  body.blind div.act.secret{display:none}
  body.blind .role.secret{visibility:hidden}
  .seat.me .ava{box-shadow:0 0 0 2px #b5352c,0 0 0 4px #b5352c55}

  /* ── ряд участников: сетка до 8 в ряд, дальше 2-й ряд (без скрола) ── */
  .seatsWrap{padding:5px}
  .seats{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
  .seat{text-align:center;position:relative;min-width:0}
  .ava{
    width:100%;aspect-ratio:5/4;margin:0 auto;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:700;color:#1c1c1c;
    background:#cfcabc;border:1px solid var(--line);
  }
  .ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
  .seat .nm{font-size:13px;line-height:1.1;margin-top:4px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seat .role{font-size:11px;line-height:1.1;margin-top:1px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:5px;margin-top:3px;border:1px solid var(--line);background:#cfcabc}
  .bar > i{display:block;height:100%;background:var(--good);width:100%}
  .seat.dead{opacity:.5;filter:grayscale(.85)}
  .seat.dead .bar > i{width:0}
  .seat.dead .ava::after{
    content:"✕";position:absolute;color:#b5352c;font-size:26px;font-weight:700;
    left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  }

  /* ── строка-сводка сил ──────────────────────── */
  .summary{
    padding:6px 10px;font-size:13px;font-weight:600;
    display:flex;flex-wrap:wrap;gap:3px 12px;align-items:center;
    background:var(--paper-2);
  }
  .summary .sep{color:#9a968a}
  .summary .ok{color:var(--good)}
  .summary .bad{color:#b5352c}
  .summary .no{color:#b5352c;text-decoration:line-through}

  /* ── лента событий ──────────────────────────── */
  .feedWrap{flex:1;min-height:0;padding:6px;display:flex}
  .feed{
    flex:1;overflow-y:auto;padding:2px 8px 2px 4px;
    display:flex;flex-direction:column;gap:7px;
  }
  .ev{animation:pop .22s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.ev{animation:none}}

  .narr{text-align:center;color:var(--narr);font-size:13px;padding:2px 0}
  .narr::before{content:"— "}.narr::after{content:" —"}

  .plaque{border:2px solid var(--line);padding:9px 11px;font-size:14px;line-height:1.5}
  .plaque .who{font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:7px}
  .plaque .who .tag{
    font-family:"Pixelify Sans",monospace;font-size:11px;font-weight:700;
    padding:1px 6px;border:2px solid;border-radius:2px;
  }
  .say{background:var(--paper)}
  .say .who .nm{font-weight:700}
  .think{background:var(--think-bg);border-color:var(--think-br)}
  .think .who{color:var(--think-tx)}
  .think .who::after{content:"думает";font-weight:600;opacity:.7;font-size:12px}
  .mafia{background:var(--mafia-bg);border-color:var(--mafia-br)}
  .mafia .who{color:var(--mafia-tx)}
  .mafia .who .tag{background:var(--mafia-bg);border-color:var(--mafia-tx);color:var(--mafia-tx)}
  .whisper{background:var(--whisp-bg);border-color:var(--whisp-br)}
  .whisper .who{color:var(--whisp-tx)}
  .whisper .who .tag{background:var(--whisp-bg);border-color:var(--whisp-tx);color:var(--whisp-tx)}
  .act{background:var(--act-bg);border-color:var(--act-br);color:var(--act-tx);font-size:13px;padding:6px 11px}
  .death{background:var(--dead-bg);border-color:var(--dead-br);color:var(--dead-tx);font-weight:700;display:flex;gap:10px;align-items:center}
  .death .skull{font-size:20px}
  .vote{color:var(--ink-soft);font-size:13px;padding:2px 4px}
  .vote b{color:var(--ink)}
  .over{background:var(--ink);color:var(--paper);text-align:center;font-weight:700;padding:14px;font-size:16px}

  .conn{position:fixed;top:6px;right:10px;font-size:11px;color:#5a5a52;
    background:var(--paper);border:2px solid var(--line);padding:2px 8px}
  .conn.live{color:var(--good)}
  .conn.demo{color:#a6791f}

  .chip.you{color:#2a6aa0}
  .chip.you b{color:#b5352c;font-weight:700}

  /* ── панель хода игрока (появляется, когда твой ход) ── */
  .inputbar{display:none;padding:8px;flex-direction:column;gap:6px}
  .inputbar.on{display:flex;animation:pop .2s ease-out}
  .inputbar .lbl{font-size:12px;color:var(--ink-soft);font-weight:600}
  .inputrow{display:flex;gap:6px}
  .inputrow input{
    flex:1;min-width:0;font-family:inherit;font-size:14px;
    padding:9px 11px;border:2px solid var(--line);background:#fff;color:var(--ink);
  }
  .inputrow input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--think-br)}
  .btn{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:14px;
    padding:9px 16px;border:2px solid var(--line);cursor:pointer;white-space:nowrap}
  .btn.say{background:#f3d24e;color:#3a2e00}
  .btn.skip{background:var(--paper-2);color:#3d3d3d}
  .btn:active{transform:translateY(1px)}

  #voteMode #voteReason{
    width:100%;font-family:inherit;font-size:14px;margin-bottom:6px;
    padding:8px 11px;border:2px solid var(--line);background:#fff;color:var(--ink);
  }
  #voteMode #voteReason:focus{outline:none;box-shadow:inset 0 0 0 2px var(--think-br)}
  #whisperMode #whisperText{
    width:100%;font-family:inherit;font-size:14px;margin-bottom:6px;
    padding:8px 11px;border:2px solid var(--line);background:#fff;color:var(--ink);
  }
  #whisperMode #whisperText:focus{outline:none;box-shadow:inset 0 0 0 2px var(--whisp-br)}
  .plaque.check{background:#e5eecf;border-color:#a9c47e;color:#3c5417}
  .plaque.check .who{color:#4a6b1e}
  .votebtns{display:flex;flex-wrap:wrap;gap:5px}
  .votebtn{
    font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
    padding:7px 12px;border:2px solid var(--line);background:var(--paper-2);
  }
  .votebtn:hover{background:#fff}
  .votebtn:active{transform:translateY(1px)}
  .votebtn.off{opacity:.35;pointer-events:none}

  .feed::-webkit-scrollbar{width:12px}
  .feed::-webkit-scrollbar-thumb{background:var(--paper-2);border:2px solid var(--line)}
</style>
</head>
<body class="blind">
  <div class="conn" id="conn">подключение…</div>
  <div class="machine">

    <div class="panel topbar">
      <div class="title pixel">МАФИЯ</div>
      <div class="chip day pixel"><span>☀</span><span id="dayLabel">День 1</span></div>
      <div class="chip you pixel" id="youChip" style="display:none">Вы: <b id="youRole"></b></div>
      <div class="chip mode pixel" id="eyeBtn" onclick="document.body.classList.toggle('blind');this.classList.toggle('on')"><span class="eye">👁</span><span>Глаз бога</span></div>
    </div>

    <div class="panel seatsWrap">
      <div class="seats" id="seats"></div>
    </div>

    <div class="panel summary" id="summary">
      <span>Партия ещё не началась</span>
    </div>

    <div class="panel feedWrap">
      <div class="feed" id="feed"></div>
    </div>

    <div class="panel inputbar" id="inputbar">
      <div class="lbl" id="inputLbl">Ваша реплика</div>
      <div class="inputrow" id="sayMode">
        <input id="sayText" type="text" placeholder="Скажите что-нибудь…" autocomplete="off">
        <button class="btn say" id="btnSay">Сказать</button>
        <button class="btn skip" id="btnSkip">Молчать</button>
      </div>
      <div id="voteMode" style="display:none">
        <input id="voteReason" type="text" placeholder="Причина (по желанию)…" autocomplete="off">
        <div class="votebtns" id="voteBtns"></div>
      </div>
      <div id="whisperMode" style="display:none">
        <input id="whisperText" type="text" placeholder="Что шепнуть (по желанию)…" autocomplete="off">
        <div class="votebtns" id="whisperBtns"></div>
        <button class="btn skip" id="btnNoWhisper" style="margin-top:6px">Не шептаться</button>
      </div>
    </div>

  </div>

<script>
// ── палитра: xterm-256 → [r,g,b] (движок присылает числовой код цвета) ───────
function rgb(code){
  code=+code;
  if(code>=16 && code<=231){
    const n=code-16, r=Math.floor(n/36), g=Math.floor((n%36)/6), b=n%6;
    const v=x=>x?55+40*x:0;
    return [v(r),v(g),v(b)];
  }
  if(code>=232){const g=8+10*(code-232);return [g,g,g];}
  return [136,136,136];
}
// насыщенный тёмный вариант — чтобы имена/роли не бледнили на светлой бумаге
function deep(code){
  let [r,g,b]=rgb(code);
  const f=.60;                          // притемняем
  r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f);
  return `rgb(${r},${g},${b})`;
}
function fill(code){const [r,g,b]=rgb(code);return `rgba(${r},${g},${b},.28)`;}
function line(code){return deep(code);}

const feed=document.getElementById('feed');
const seatsEl=document.getElementById('seats');
const summaryEl=document.getElementById('summary');
const dayLabel=document.getElementById('dayLabel');
const connEl=document.getElementById('conn');
const inputbar=document.getElementById('inputbar');
const sayText=document.getElementById('sayText');
const inputLbl=document.getElementById('inputLbl');
const sayMode=document.getElementById('sayMode');
const voteMode=document.getElementById('voteMode');
const voteBtns=document.getElementById('voteBtns');
const voteReason=document.getElementById('voteReason');
const whisperMode=document.getElementById('whisperMode');
const whisperBtns=document.getElementById('whisperBtns');
const whisperText=document.getElementById('whisperText');
const youChip=document.getElementById('youChip');
const youRoleEl=document.getElementById('youRole');

let players=[];            // [{name,c,role,alive}]
let myName=null;           // имя человека за столом
const roleRu={mafia:"Мафия",maniac:"Маньяк",komissar:"Комиссар",doctor:"Доктор",civilian:"Мирный"};
const colorOf=n=>{const p=players.find(x=>x.name===n);return p?deep(p.c):"#333";};

// ── отправка действия человека серверу (обратный канал) ──
async function sendAction(body){
  try{ await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
  catch(_){ /* демо-режим без сервера — глотаем */ }
}
function nameButtons(container, cands, onPick){
  container.innerHTML="";
  (cands||[]).forEach(name=>{
    const b=document.createElement('button');
    b.className="votebtn"; b.textContent=name;
    b.style.color=colorOf(name); b.style.borderColor=colorOf(name);
    b.onclick=()=>onPick(name);
    container.appendChild(b);
  });
}
function showInput(e){
  const kind=e.kind;
  sayMode.style.display="none"; voteMode.style.display="none"; whisperMode.style.display="none";
  if(kind==="say"){
    inputLbl.textContent="Ваша реплика";
    sayMode.style.display=""; inputbar.classList.add('on'); sayText.value=""; sayText.focus();
  } else if(kind==="vote" || kind==="check"){
    inputLbl.textContent = kind==="vote" ? "Ваш голос — кого казнить?" : "Ночь. Кого проверить?";
    voteMode.style.display="";
    voteReason.style.display = kind==="vote" ? "" : "none";
    voteReason.value="";
    nameButtons(voteBtns, e.candidates, (name)=>{
      hideInput();
      if(kind==="vote") sendAction({target:name, reason:voteReason.value.trim()});
      else sendAction({target:name});
    });
    inputbar.classList.add('on');
  } else if(kind==="whisper"){
    inputLbl.textContent="Шепнуть кому-то? Напиши сообщение, потом выбери кому:";
    whisperMode.style.display="";
    whisperText.value="";
    nameButtons(whisperBtns, e.candidates, (name)=>{
      const t=whisperText.value.trim();
      if(!t){ whisperText.focus(); return; }   // без текста не шлём — никаких слов за тебя
      hideInput(); sendAction({to:name, text:t});
    });
    const toggle=()=>{ const on=whisperText.value.trim().length>0;
      whisperBtns.querySelectorAll('.votebtn').forEach(b=>b.classList.toggle('off',!on)); };
    whisperText.oninput=toggle; toggle();
    inputbar.classList.add('on'); whisperText.focus();
  }
}
function hideInput(){ inputbar.classList.remove('on'); }
function submitSay(){ if(!inputbar.classList.contains('on'))return; const t=sayText.value.trim(); hideInput(); sendAction({text:t, silent:!t}); }
function submitSkip(){ if(!inputbar.classList.contains('on'))return; hideInput(); sendAction({silent:true}); }

document.getElementById('btnSay').onclick=submitSay;
document.getElementById('btnSkip').onclick=submitSkip;
document.getElementById('btnNoWhisper').onclick=()=>{ if(!inputbar.classList.contains('on'))return; hideInput(); sendAction({skip:true}); };
sayText.addEventListener('keydown',(e)=>{ if(e.key==="Enter")submitSay(); });

function render(){
  seatsEl.innerHTML="";
  players.forEach(p=>{
    const seat=document.createElement('div');
    seat.className="seat"+(p.alive?"":" dead")+(p.name===myName?" me":"");
    seat.innerHTML=`
      <div class="ava">${(p.name||'?')[0]}${p.av?`<img src="avatars/${p.av}" alt="" onerror="this.remove()">`:''}</div>
      <div class="nm" style="color:${deep(p.c)}">${p.name}</div>
      <div class="role${p.alive&&p.name!==myName?' secret':''}" style="color:${deep(p.c)}">${roleRu[p.role]||''}</div>
      <div class="bar"><i></i></div>`;
    seatsEl.appendChild(seat);
  });
  renderSummary();
}

function renderSummary(){
  if(!players.length){summaryEl.innerHTML="<span>Партия ещё не началась</span>";return;}
  const alive=players.filter(p=>p.alive);
  const c=r=>alive.filter(p=>p.role===r).length;
  // роли-числа: мафия/маньяк — красным (враги), считаем живых. Новую роль добавить сюда одной строкой.
  const counts=[["Мафия","mafia","bad"],["Маньяк","maniac","bad"]];
  // роли-одиночки: показываем ✓ (кто-то жив) / ✗ (выбыл).
  const flags=[["🔍 Комиссар","komissar"],["🩺 Доктор","doctor"]];
  const parts=[`<span>Живых: <b>${alive.length}</b></span>`];
  counts.forEach(([lbl,r,cls])=>parts.push(`<span class="${cls}">${lbl}: <b>${c(r)}</b></span>`));
  flags.forEach(([lbl,r])=>parts.push(
    c(r)>0 ? `<span class="ok">${lbl} ✓</span>` : `<span class="no">${lbl} ✗</span>`));
  parts.push(`<span class="ok">Мирные: <b>${c("civilian")}</b></span>`);   // мирные — зелёным, в конце
  summaryEl.innerHTML=parts.join('<span class="sep">·</span>');
}

function atBottom(){return feed.scrollHeight-feed.scrollTop-feed.clientHeight<60;}
function add(node){
  const stick=atBottom();
  node.classList.add('ev');
  feed.appendChild(node);
  if(stick) feed.scrollTop=feed.scrollHeight;
}
function el(cls,html){const d=document.createElement('div');d.className=cls;if(/\b(think|act)\b/.test(cls))d.className+=" secret";d.innerHTML=html;return d;}
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

// ── обработка событий от сервера ────────────────────────────────────────────
function handle(e){
  switch(e.type){
    case "reset":
      players=[];feed.innerHTML="";render();dayLabel.textContent="День 1";hideInput();break;
    case "you":
    myName=e.name; youRoleEl.textContent=roleRu[e.role]||e.role; youChip.style.display="";render();break;
    case "your_turn":
      showInput(e);break;
    case "your_turn_done":
      hideInput();break;
    case "check_result":
      add(el("plaque check",`<div class="who">🔍 Твоя проверка</div><div><b>${esc(e.name)}</b> — ${roleRu[e.role]||esc(e.role)}</div>`));break;
    case "note":
      add(el("narr",esc(e.text)));break;
    case "roster":
    players=e.players.map(p=>({name:p.name,c:p.c,av:p.av,role:p.role,alive:p.alive!==false}));
      if(e.day)dayLabel.textContent="День "+e.day;
      render();break;
    case "day":
      dayLabel.textContent="День "+e.day;break;
    case "dead":{
      const p=players.find(x=>x.name===e.name);if(p)p.alive=false;render();break;}
    case "narrator":
      add(el("narr",esc(e.text)));break;
    case "say":{
      const col=deep(e.c);
      add(el("plaque say",
        `<div class="who"><span class="nm" style="color:${col}">${esc(e.name)}</span></div>`+
        `<div>${esc(e.text)}</div>`));break;}
    case "silence":
      add(el("narr",esc(e.name)+" промолчал…"));break;
    case "think":
      add(el("plaque think",
        `<div class="who">${esc(e.name)}</div><div>${esc(e.text)}</div>`));break;
        case "pm":{
      const mafia=e.channel==="mafia";
      const mine=e.from===myName||(e.to&&e.to.includes(myName));
      add(el("plaque "+(mafia?"mafia":"whisper")+(mine?"":" secret"),
        `<div class="who"><span class="tag">${mafia?"мафия":"шёпот"}</span>${esc(e.from)}</div>`+
        `<div>${esc(e.text)}</div>`));break;}
    case "act":
      add(el("act",esc(e.text)));break;
    case "result":
      add(el("plaque death",
        `<span class="skull">💀</span><span>${esc(e.text)}</span>`));break;
    case "vote":
      add(el("vote",`${esc(e.voter)} → <b>${esc(e.target)}</b>`+(e.reason?` · ${esc(e.reason)}`:"")));break;
    case "gameover":
      add(el("over",esc(e.text)));break;
  }
}

// ── связь с сервером (SSE) + демо-заглушка, если сервера ещё нет ─────────────
let gotReal=false, demoTimer=null;
function connect(){
  let src;
  try{ src=new EventSource('/events'); }catch(_){ return startDemo(); }
  src.onmessage=ev=>{
    if(!gotReal){gotReal=true;stopDemo();connEl.textContent="● эфир";connEl.className="conn live";}
    try{handle(JSON.parse(ev.data));}catch(_){}
  };
  src.onerror=()=>{ if(!gotReal) startDemo(); };
}

// демо крутит короткий сценарий — чтобы видеть оформление без сервера
function startDemo(){
  if(demoTimer||gotReal)return;
  connEl.textContent="◐ демо (сервер не подключён)";connEl.className="conn demo";
  let i=0;
  const script=[
    {type:"reset"},
    {type:"roster",day:1,players:[
      {name:"МируМир",c:80,role:"mafia"},{name:"СеСтруХа",c:211,role:"civilian"},
      {name:"Тень",c:145,role:"mafia"},{name:"ПрофеССор",c:183,role:"komissar"},
      {name:"КабанЪ",c:179,role:"maniac"},{name:"Фурия",c:211,role:"civilian"},
      {name:"Кекс228",c:114,role:"doctor"},{name:"Трубач",c:111,role:"civilian"}]},
    {type:"narrator",text:"Ночь 1. Деревня засыпает."},
    {type:"pm",channel:"mafia",from:"МируМир",text:"Тень, предлагаю убить Фурию — активные всегда опасны. Днём держимся порознь, изображаем мирных."},
    {type:"pm",channel:"mafia",from:"Тень",text:"Согласна. Днём я первая скажу, что она давила слишком уверенно."},
    {type:"act",text:"🔪 мафия целится в: Трубач"},
    {type:"act",text:"🩺 доктор (Кекс228) лечит: Кекс228"},
    {type:"act",text:"🔍 комиссар (ПрофеССор) проверяет: Тень → МАФИЯ"},
    {type:"day",day:1},
    {type:"narrator",text:"День 1."},
    {type:"result",text:"Ночью убили Трубач. Трубач — Мирный."},
    {type:"dead",name:"Трубач"},
    {type:"narrator",text:"круг обсуждения 1/2"},
    {type:"think",name:"КабанЪ",text:"Трубач убит — он мирный. Один труп, всё ровно, доктор явно кого-то прикрыл. Тяну игру, я маньяк."},
    {type:"say",name:"КабанЪ",c:179,text:"Ну чё, кто-то ж мочканул Трубача. Я спал как убитый, зуб даю."},
    {type:"say",name:"ПрофеССор",c:183,text:"Тень, ты подозрительно тихо себя ведёшь. Присмотримся к тебе."},
    {type:"vote",voter:"Фурия",target:"Тень",reason:"молчит весь день"},
    {type:"gameover",text:"🏆 ДЕРЕВНЯ ПОБЕДИЛА"},
  ];
  demoTimer=setInterval(()=>{
    if(gotReal||i>=script.length){stopDemo();return;}
    handle(script[i++]);
  },1100);
}
function stopDemo(){if(demoTimer){clearInterval(demoTimer);demoTimer=null;}}

connect();
</script>
