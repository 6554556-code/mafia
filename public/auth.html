<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МАФИЯ · вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#b7bdae; --paper:#f2efe6; --paper-2:#e9e5d8;
    --ink:#2c2c28; --ink-soft:#5a5a52; --line:#2c2c28;
    --red:#b5352c; --red-bg:#f6d9d8; --red-br:#d98f8c;
    --good:#2f8f4e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--sage);
    font-family:ui-monospace,"DejaVu Sans Mono",Consolas,"Liberation Mono",monospace;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:14px;-webkit-font-smoothing:none;
  }
  .pixel{font-family:"Pixelify Sans",ui-monospace,monospace}

  .card{
    width:100%;max-width:400px;
    background:var(--paper);
    border:3px solid var(--line);
    box-shadow:inset 0 0 0 2px var(--paper), 4px 4px 0 rgba(44,44,40,.18);
    padding:22px 20px;
  }
  .brand{text-align:center;margin-bottom:4px}
  .brand .t{font-size:34px;font-weight:700;letter-spacing:2px}
  .brand .s{font-size:13px;color:var(--ink-soft);letter-spacing:1px}

  .tabs{display:flex;gap:6px;margin:18px 0 16px}
  .tab{
    flex:1;text-align:center;cursor:pointer;user-select:none;
    padding:8px 0;font-size:15px;font-weight:700;
    background:var(--paper-2);border:2px solid var(--line);color:var(--ink-soft);
  }
  .tab.on{background:var(--red);color:#fff}

  label{display:block;font-size:12px;letter-spacing:.5px;margin:12px 0 4px;color:var(--ink-soft)}
  input{
    width:100%;padding:9px 10px;font-size:15px;
    font-family:inherit;color:var(--ink);
    background:#fbfaf5;border:2px solid var(--line);outline:none;
  }
  input:focus{border-color:var(--red)}

  .btn{
    width:100%;margin-top:18px;padding:11px 0;cursor:pointer;
    font-size:16px;font-weight:700;letter-spacing:1px;
    background:var(--ink);color:var(--paper);border:2px solid var(--line);
    box-shadow:3px 3px 0 rgba(44,44,40,.2);
  }
  .btn:active{transform:translate(1px,1px);box-shadow:2px 2px 0 rgba(44,44,40,.2)}
  .btn:disabled{opacity:.6;cursor:default}

  .msg{margin-top:14px;padding:9px 10px;font-size:13px;display:none}
  .msg.err{display:block;background:var(--red-bg);border:2px solid var(--red-br);color:var(--red)}
  .hint{margin-top:12px;font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <div class="brand pixel">
      <div class="t">🕵 МАФИЯ</div>
      <div class="s">вход за стол</div>
    </div>

    <div class="tabs pixel">
      <div class="tab on" id="tabLogin">Вход</div>
      <div class="tab" id="tabReg">Регистрация</div>
    </div>

    <label for="email">Почта</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@mail.com">

    <div id="nameRow" style="display:none">
      <label for="name">Игровой ник (2–16 символов)</label>
      <input id="name" type="text" maxlength="16" autocomplete="off" placeholder="как звать за столом">
    </div>

    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="минимум 6 символов">

    <button class="btn pixel" id="submit">ВОЙТИ</button>

    <div class="msg" id="msg"></div>
    <div class="hint pixel" id="hint">Ник будет твоим именем за столом.</div>
  </div>

<script>
  let mode = "login"; // "login" | "register"
  const $ = (id) => document.getElementById(id);
  const nameRow = $("nameRow"), msg = $("msg"), btn = $("submit"), hint = $("hint");

  function setMode(m){
    mode = m;
    $("tabLogin").classList.toggle("on", m==="login");
    $("tabReg").classList.toggle("on", m==="register");
    nameRow.style.display = m==="register" ? "block" : "none";
    btn.textContent = m==="register" ? "СОЗДАТЬ" : "ВОЙТИ";
    $("password").setAttribute("autocomplete", m==="register" ? "new-password" : "current-password");
    hideMsg();
  }
  $("tabLogin").onclick = () => setMode("login");
  $("tabReg").onclick   = () => setMode("register");

  function showErr(text){ msg.textContent = text; msg.className = "msg err"; }
  function hideMsg(){ msg.className = "msg"; msg.textContent = ""; }

  async function go(){
    hideMsg();
    const email = $("email").value.trim();
    const password = $("password").value;
    const name = $("name").value.trim();
    if(!email || !password || (mode==="register" && !name)){
      showErr("Заполни все поля.");
      return;
    }
    const body = mode==="register" ? { email, password, name } : { email, password };
    btn.disabled = true;
    try{
      const res = await fetch("/"+mode, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok || data.error){
        showErr(data.error || "Что-то пошло не так, попробуй ещё раз.");
        btn.disabled = false;
        return;
      }
      location.href = "/"; // успех — за стол
    }catch(e){
      showErr("Сервер не отвечает. Проверь соединение.");
      btn.disabled = false;
    }
  }
  btn.onclick = go;
  document.addEventListener("keydown", (e) => { if(e.key === "Enter") go(); });

  setMode("login");
</script>
</body>
</html>
